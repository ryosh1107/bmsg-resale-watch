name: BMSG resale watch

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'テスト通知を送る'
        type: boolean
        default: true

concurrency:
  group: resale-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 通知済みの記録を復元
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-

      - name: Playwright を入れる（ブラウザ本体はプリインストールのChromeを使う）
        run: npm install --no-save --no-audit --no-fund playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: リセールをチェック
        run: node watch.mjs
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
          SEARCH_EVENT: ''
          NOTIFY_PURCHASING: 'false'

      - name: 通知済みの記録を保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
