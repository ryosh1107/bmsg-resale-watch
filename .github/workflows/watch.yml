name: BMSG resale watch

on:
  schedule:
    - cron: '*/30 * * * *'   # 予備（常駐ループが止まっていたら再開する）
  workflow_dispatch:
    inputs:
      test:
        description: 'テスト通知を送る（1回だけチェックして終了）'
        type: boolean
        default: true

# 同時に2つ動かさない（実行中に次の起動が来たら、終わるまで待機）
concurrency:
  group: resale-watch-${{ (github.event_name == 'workflow_dispatch' && inputs.test) && 'test' || 'loop' }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 通知済みの記録を復元
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-

      - name: Playwright を入れる（ブラウザ本体はプリインストールのChromeを使う）
        run: npm install --no-save --no-audit --no-fund playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: リセールをチェック（常駐ループ）
        run: node watch.mjs
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
          INTERVAL_SEC: '10'     # 更新タイミングを学習できていないときのチェック間隔（秒）
          PERIOD_SEC: '60'       # 一覧の更新周期の初期値（秒）。動かしながら自動で補正される
          LOOP_MINUTES: '330'    # 1回の実行で動き続ける時間（分）
          SEARCH_EVENT: ''
          WANT_DATE: '2026/10/12'   # 通知する日付（空にすると全日程）
          WANT_COUNT: '2'           # 通知する枚数（0にすると枚数を問わない）
          NOTIFY_PURCHASING: 'false'

      - name: 通知済みの記録を保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 分析用ログを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
